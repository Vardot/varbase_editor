################################################################################
# Self-contained build + validate CI (parity with the Varbase 11.0.x setup).
#
# `build:composer-validate` gates the pipeline. PHPCS / PHPStan / cspell /
# eslint / stylelint run as NON-BLOCKING checks (allow_failure) for now, so the
# pipeline stays green while the code is progressively cleaned; flip a job to
# `allow_failure: false` to make it gating once its project passes cleanly.
# Runs on branches, merge requests and tags.
################################################################################
stages: [build, validate]
variables:
  # Drupal 11.4.0 released 2026-07-01; pinned templates ref $CORE_STABLE is still 11.3.
  DRUPAL_CORE: "11.4.0"
  IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_MEMORY_LIMIT: "-1"
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:composer-validate:
  stage: build
  image: public.ecr.aws/docker/library/composer:2
  script:
    - composer validate --no-check-all --no-check-publish

phpcs:
  stage: validate
  image: public.ecr.aws/docker/library/php:8.3-cli
  before_script:
    - apt-get update -y > /dev/null && apt-get install -y -qq git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
    - composer global require --no-interaction --no-progress drupal/coder:^8.3 dealerdirect/phpcodesniffer-composer-installer:^1
    - export PATH="$HOME/.composer/vendor/bin:$PATH"
  script:
    - |
      if [ -f .phpcs.xml ] || [ -f .phpcs.xml.dist ]; then
        phpcs -p
      else
        phpcs -p --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme,yml,txt,md .
      fi
  allow_failure: true

phpstan:
  stage: validate
  image: public.ecr.aws/docker/library/php:8.3-cli
  before_script:
    - apt-get update -y > /dev/null && apt-get install -y -qq git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer create-project drupal/recommended-project:~$DRUPAL_CORE /drupal --no-interaction --no-install
    - cd /drupal
    - composer config --no-plugins allow-plugins true
    - composer config minimum-stability dev
    - composer require --no-interaction --no-progress --ignore-platform-reqs mglaman/phpstan-drupal phpstan/extension-installer drush/drush
    - composer install --no-interaction --no-progress --ignore-platform-reqs
    - mkdir -p web/modules/custom && cp -r "$CI_PROJECT_DIR" "web/modules/custom/$CI_PROJECT_NAME"
  script:
    - cd /drupal
    - |
      if [ -f "web/modules/custom/$CI_PROJECT_NAME/phpstan.neon" ]; then
        php -d memory_limit=2G ./vendor/bin/phpstan analyse -c "web/modules/custom/$CI_PROJECT_NAME/phpstan.neon" --no-progress
      else
        php -d memory_limit=2G ./vendor/bin/phpstan analyse "web/modules/custom/$CI_PROJECT_NAME" --level=1 --no-progress
      fi
  allow_failure: true

cspell:
  stage: validate
  image: public.ecr.aws/docker/library/node:20
  before_script:
    - npm install -g cspell
  script:
    - |
      if [ -f .cspell.json ] || [ -f cspell.json ]; then
        cspell lint . --no-progress
      else
        echo "no cspell config - skipping"
      fi
  allow_failure: true

eslint:
  stage: validate
  image: public.ecr.aws/docker/library/node:20
  before_script:
    - if [ ! -f package.json ]; then echo "no package.json"; exit 0; fi
    - corepack enable && yarn install --mode=skip-build || true
  script:
    - yarn lint:js || true
    - yarn lint:yaml || true
  allow_failure: true

stylelint:
  stage: validate
  image: public.ecr.aws/docker/library/node:20
  before_script:
    - if [ ! -f package.json ]; then echo "no package.json"; exit 0; fi
    - corepack enable && yarn install --mode=skip-build || true
  script:
    - yarn lint:css || true
  allow_failure: true
